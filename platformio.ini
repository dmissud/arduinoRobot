; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600  # Vitesse du moniteur série
lib_deps =
    Wire
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0


[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
board_build.mcu = atmega2560
board_build.f_cpu = 16000000L
lib_deps =
    Wire
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0

; Options de communication série optionnelles
monitor_speed = 9600

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
board_build.mcu = atmega2560
board_build.f_cpu = 16000000L

; Dépendances de bibliothèques
lib_deps =
    Wire
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0

; Options de communication série
monitor_speed = 115200
monitor_port = /dev/ttyUSB0

; Options de téléversement
upload_port = /dev/ttyUSB0
upload_speed = 115200

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    ESP8266WiFi
    ESP8266WebServer

monitor_speed = 115200
upload_port = /dev/ttyUSB1  # Ajustez selon votre configuration

[env:native]
platform = native
build_flags = -std=gnu++11
lib_deps =
    fabiobatsilva/ArduinoFake@^0.4
lib_compat_mode = off
test_filter = test_native*
test_build_src = yes
build_src_filter = -<*> +<Application.cpp>